<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raphael-WA-BOT</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" sizes="48x48">
    <link rel="apple-touch-icon" href="favicon.png">

    <!-- Tipografías limpias y técnicas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

    <!-- CSS externo (si notas conflictos visuales con el nuevo diseño, puedes comentar esta línea) -->
    <link rel="stylesheet" href="../pestañas/pruebas.css">

    <style>
        :root {
            --bg-black: #030508;
            --electric-blue: #00a8ff;
            --electric-cyan: #38bdf8;
            --electric-deep: #0284c7;
            --glass-bg: rgba(10, 16, 28, 0.48);
            --glass-bg-hover: rgba(14, 24, 42, 0.62);
            --glass-border: rgba(148, 210, 255, 0.14);
            --glass-border-hover: rgba(56, 189, 248, 0.45);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas de fondo eléctrico */
        #electric-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
            background: radial-gradient(circle at 50% 0%, #071226 0%, #030508 65%, #000000 100%);
        }

        /* Viñeta sutil para dar profundidad y legibilidad */
        .ambient-vignette {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(circle at 50% 40%, transparent 25%, rgba(0, 0, 0, 0.72) 100%);
        }

        /* Clase base Glassmorphism */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid var(--glass-border);
            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* Barra superior minimalista */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 900;
            background: rgba(3, 5, 8, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .menu-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            padding: 9px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            font-weight: 500;
            transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
        }

        .menu-btn:hover {
            border-color: var(--glass-border-hover);
            background: rgba(20, 32, 54, 0.8);
        }

        .menu-btn:active {
            transform: scale(0.97);
        }

        .brand-mini {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.14em;
            color: var(--text-muted);
            text-transform: uppercase;
            display: none;
        }

        @media (min-width: 640px) {
            .brand-mini {
                display: block;
            }
        }

        /* Insignia de estado */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-radius: 999px;
            background: rgba(10, 16, 28, 0.65);
            border: 1px solid rgba(56, 189, 248, 0.2);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: var(--text-main);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #22c55e;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.9);
            animation: pulseDot 2.4s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(0.85); }
        }

        /* Fondo oscuro cuando se abre el menú */
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 1000;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* Menú lateral Glassmorphism */
        .side-menu {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 280px;
            max-width: 85vw;
            transform: translateX(-100%);
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 1001;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            background: rgba(6, 10, 18, 0.84);
            backdrop-filter: blur(26px) saturate(150%);
            -webkit-backdrop-filter: blur(26px) saturate(150%);
            border-right: 1px solid rgba(56, 189, 248, 0.18);
            box-shadow: 20px 0 60px rgba(0, 0, 0, 0.85);
        }

        .side-menu.open {
            transform: translateX(0);
        }

        .side-menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 10px 20px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 16px;
        }

        .side-menu-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            color: var(--text-main);
        }

        .close-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            width: 34px;
            height: 34px;
            border-radius: 8px;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
        }

        .close-btn:hover {
            color: #fff;
            border-color: var(--glass-border-hover);
            background: rgba(56, 189, 248, 0.1);
        }

        .side-nav {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
        }

        .side-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.94rem;
            font-weight: 500;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .side-nav a svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            flex-shrink: 0;
            opacity: 0.8;
