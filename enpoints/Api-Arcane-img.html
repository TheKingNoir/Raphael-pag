<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Arcane Imágenes - Raphael-WA-BOT</title>

    <link rel="icon" type="image/jpeg" href="https://files.yuki-wabot.my.id/cdn/o4L8InXt.jpeg">
    <link rel="apple-touch-icon" href="https://files.yuki-wabot.my.id/cdn/o4L8InXt.jpeg">

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-black: #030508;
            --electric-blue: #00a8ff;
            --electric-cyan: #38bdf8;
            --electric-deep: #0284c7;
            --glass-bg: rgba(10, 16, 28, 0.48);
            --glass-bg-hover: rgba(14, 24, 42, 0.68);
            --glass-border: rgba(148, 210, 255, 0.14);
            --glass-border-hover: rgba(56, 189, 248, 0.45);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Fondo eléctrico */
        #electric-canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
            background: radial-gradient(circle at 50% 0%, #071226 0%, #030508 65%, #000000 100%);
        }

        .ambient-vignette {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(circle at 50% 40%, transparent 25%, rgba(0, 0, 0, 0.72) 100%);
        }

        /* Glassmorphism base */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(18px) saturate(140%);
            -webkit-backdrop-filter: blur(18px) saturate(140%);
            border: 1px solid var(--glass-border);
            box-shadow:
                0 20px 45px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* Barra superior fija */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 950;
            background: rgba(3, 5, 8, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            padding: 9px 15px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
        }

        .back-btn:hover {
            border-color: var(--glass-border-hover);
            background: rgba(20, 32, 54, 0.8);
            color: #ffffff;
        }

        .back-btn:active {
            transform: scale(0.97);
        }

        .brand-mini {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.14em;
            color: var(--text-muted);
            text-transform: uppercase;
            display: none;
        }

        @media (min-width: 640px) {
            .brand-mini {
                display: block;
            }
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 14px;
            border-radius: 999px;
            background: rgba(10, 16, 28, 0.65);
            border: 1px solid rgba(56, 189, 248, 0.2);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: var(--text-main);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #22c55e;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.9);
            animation: pulseDot 2.4s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.55; transform: scale(0.85); }
        }

        /* Contenedor Principal */
        main {
            max-width: 980px;
            margin: 0 auto;
            padding: 106px 20px 60px 20px;
        }

        /* Tarjeta Hero */
        .page-hero {
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 36px;
        }

        .page-hero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 16%;
            right: 16%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.75), transparent);
        }

        .logo-frame {
            width: 116px;
            height: 116px;
            margin: 0 auto 20px auto;
            padding: 5px;
            border-radius: 20px;
            background: linear-gradient(145deg, rgba(56, 189, 248, 0.35), rgba(15, 23, 42, 0.4));
            border: 1px solid rgba(56, 189, 248, 0.35);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 168, 255, 0.16);
        }

        .logo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            display: block;
            background: #05080f;
        }

        .hero-kicker {
            display: inline-block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--electric-cyan);
            margin-bottom: 8px;
        }

        .page-hero h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.9rem, 5vw, 2.8rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .page-hero p {
            color: var(--text-muted);
            font-size: 0.98rem;
            max-width: 480px;
            margin: 0 auto;
        }

        /* Encabezado de sección */
        .section-header {
            margin-bottom: 18px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: -0.01em;
        }

        .section-sub {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.74rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* Tarjeta Buscador */
        .api-card {
            border-radius: 20px;
            padding: 28px 26px;
            position: relative;
            overflow: hidden;
            text-align: center;
            max-width: 720px;
            margin: 0 auto 30px auto;
        }

        .api-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 18%;
            right: 18%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.5), transparent);
        }

        .api-title-wrap {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .api-title-wrap svg {
            width: 21px;
            height: 21px;
            color: var(--electric-cyan);
        }

        .api-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
        }

        /* Estado */
        #status {
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
            margin-bottom: 16px;
            color: var(--electric-cyan);
            font-weight: 500;
            min-height: 22px;
            font-size: 0.83rem;
        }

        #status.error {
            color: #f87171;
        }

        #status.success {
            color: #34d399;
        }

        /* Input */
        .input-url {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(5, 9, 18, 0.65);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            margin-bottom: 18px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .input-url::placeholder {
            color: var(--text-dim);
        }

        .input-url:focus {
            border-color: var(--glass-border-hover);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
        }

        /* Botones alineados */
        .button-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            min-height: 44px;
            padding: 11px 16px;
            border-radius: 11px;
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.18s ease, border-color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .btn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-primary {
            background: linear-gradient(180deg, #0ea5e9 0%, #0284c7 100%);
            color: #ffffff;
            border: 1px solid rgba(125, 211, 252, 0.55);
            box-shadow: 0 8px 22px rgba(2, 132, 199, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .btn-primary:hover {
            box-shadow: 0 10px 28px rgba(14, 165, 233, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        .btn-danger-glass {
            background: rgba(127, 29, 29, 0.28);
            color: #fca5a5;
            border: 1px solid rgba(248, 113, 113, 0.28);
            backdrop-filter: blur(10px);
        }

        .btn-danger-glass:hover {
            background: rgba(153, 27, 27, 0.42);
            border-color: rgba(248, 113, 113, 0.55);
            color: #ffffff;
        }

        /* Grilla de Resultados */
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
            gap: 18px;
        }

        .image-preview-card {
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 12px;
            transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease;
        }

        .image-preview-card:hover {
            transform: translateY(-4px);
            background: var(--glass-bg-hover);
            border-color: var(--glass-border-hover);
        }

        .image-preview-card img {
            width: 100%;
            height: 165px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
            background: rgba(5, 9, 18, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .img-title {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 10px;
            min-height: 36px;
            max-height: 36px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            width: 100%;
            line-height: 1.4;
        }

        /* Botón de descarga por tarjeta */
        .btn-download {
            width: 100%;
            min-height: 36px;
            padding: 7px 12px;
            border-radius: 9px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: rgba(14, 165, 233, 0.16);
            color: var(--electric-cyan);
            border: 1px solid rgba(56, 189, 248, 0.32);
            transition: all 0.2s ease;
        }

        .btn-download:hover {
            background: linear-gradient(180deg, #0ea5e9 0%, #0284c7 100%);
            color: #ffffff;
            border-color: rgba(125, 211, 252, 0.6);
        }

        .btn-download.downloading {
            background: rgba(245, 158, 11, 0.2);
            color: #fcd34d;
            border-color: rgba(245, 158, 11, 0.45);
            cursor: wait;
        }

        .btn-download.downloaded {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border-color: rgba(52, 211, 153, 0.45);
        }

        .btn-download.error {
            background: rgba(239, 68, 68, 0.22);
            color: #fca5a5;
            border-color: rgba(248, 113, 113, 0.45);
        }

        .source-link {
            display: block;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 8px;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .source-link:hover {
            color: var(--electric-cyan);
        }

        /* Spinner y sin resultados */
        .loading-spinner,
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px 20px;
            border-radius: 16px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
        }

        .loading-spinner {
            color: var(--electric-cyan);
        }

        .loading-spinner::after {
            content: '';
            display: inline-block;
            width: 16px;
            height: 16px;
            margin-left: 10px;
            vertical-align: middle;
            border: 2px solid rgba(56, 189, 248, 0.25);
            border-top: 2px solid var(--electric-cyan);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-results {
            color: var(--text-muted);
        }

        footer {
            margin-top: 64px;
            padding: 28px 20px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            background: rgba(3, 5, 8, 0.65);
            backdrop-filter: blur(12px);
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        @media (max-width: 540px) {
            .page-hero {
                padding: 32px 20px;
            }
            .api-card {
                padding: 22px 18px;
            }
            .button-group {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Fondo animado eléctrico -->
    <canvas id="electric-canvas" aria-hidden="true"></canvas>
    <div class="ambient-vignette" aria-hidden="true"></div>

    <!-- Barra superior -->
    <header class="topbar">
        <a href="../pestañas/apis.html" class="back-btn">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Volver</span>
        </a>

        <span class="brand-mini">RAPHAEL // API IMG</span>

        <div class="status-badge">
            <span class="status-dot"></span>
            <span>En Línea</span>
        </div>
    </header>

    <main>
        <section class="page-hero glass">
            <div class="logo-frame">
                <img src="https://files.yuki-wabot.my.id/cdn/bkrzeYYr.jpeg" alt="Logo API Imágenes">
            </div>
            <span class="hero-kicker">Image Search Endpoint</span>
            <h1>API ARCANE IMÁGENES</h1>
            <p>Busca y descarga imágenes de forma rápida.</p>
        </section>

        <div class="section-header">
            <h2 class="section-title">Buscador de Imágenes</h2>
            <span class="section-sub">Consulta en Vivo</span>
        </div>

        <section class="api-card glass">
            <div class="api-title-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <h3 class="api-title">Escribe tu búsqueda</h3>
            </div>

            <div id="status">Busca cualquier tema</div>

            <input type="text" id="searchQuery" class="input-url" placeholder="Ej: anime, carros, paisajes, gatos..." value="">

            <div class="button-group">
                <button class="btn btn-primary" onclick="buscarImagenes()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    Buscar Imágenes
                </button>
                <button class="btn btn-danger-glass" onclick="limpiarResultados()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    Limpiar
                </button>
            </div>
        </section>

        <div id="imageResults" class="image-grid"></div>
    </main>

    <footer>
        <p>Raphael-WA-BOT - Todos los derechos reservados.</p>
    </footer>

    <script>
        /* --- Lógica de la API de Imágenes --- */
        const API_URL = 'https://bimg-api.raphaelbot.com';
        const API_KEY = '8affc894-e6ce-409e-95c0-ff19c8bc71e4';

        async function buscarImagenes() {
            const query = document.getElementById('searchQuery').value.trim();
            const statusEl = document.getElementById('status');
            const resultsContainer = document.getElementById('imageResults');

            if (!query) {
                statusEl.className = 'error';
                statusEl.innerText = 'Por favor, ingresa un término de búsqueda.';
                resultsContainer.innerHTML = '';
                return;
            }

            statusEl.className = '';
            statusEl.innerText = 'Buscando imágenes...';
            resultsContainer.innerHTML = `<div class="loading-spinner glass">Buscando</div>`;

            try {
                const endpoint = `${API_URL}/search?query=${encodeURIComponent(query)}&limit=12&download=false`;

                const response = await fetch(endpoint, {
                    headers: { 'x-api-key': API_KEY }
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `Error ${response.status}`);
                }

                const data = await response.json();
                resultsContainer.innerHTML = '';

                if (!data.success || data.count === 0 || !data.results || data.results.length === 0) {
                    statusEl.className = 'error';
                    statusEl.innerText = `No se encontraron imágenes para "${query}"`;
                    resultsContainer.innerHTML = `<div class="no-results glass">No hay resultados para tu búsqueda.</div>`;
                    return;
                }

                statusEl.className = 'success';
                statusEl.innerText = `${data.count} imágenes encontradas para "${query}"`;

                data.results.forEach((img, index) => {
                    const card = document.createElement('div');
                    card.className = 'image-preview-card glass';

                    const imgUrl = img.image || img.thumbnail || '';
                    const title = img.title || `Imagen ${index + 1}`;
                    const safeTitle = title.replace(/'/g, "\\'").replace(/"/g, '&quot;');

                    card.innerHTML = `
                        <img src="${imgUrl}" alt="${safeTitle}"
                             loading="lazy"
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22160%22%3E%3Crect fill=%22%230b1220%22 width=%22200%22 height=%22160%22/%3E%3Ctext x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%2364748b%22 font-size=%2213%22 font-family=%22Arial%22%3EImagen no disponible%3C/text%3E%3C/svg%3E'">
                        <div class="img-title">${title.substring(0, 60)}${title.length > 60 ? '...' : ''}</div>
                        <button class="btn-download" onclick="descargarImagen('${encodeURIComponent(imgUrl)}', '${safeTitle}', this)">
                            Descargar
                        </button>
                        ${img.source ? `<a href="${img.source}" target="_blank" rel="noopener noreferrer" class="source-link">Ver fuente &rarr;</a>` : ''}
                    `;

                    resultsContainer.appendChild(card);
                });

            } catch (error) {
                console.error('Error:', error);
                statusEl.className = 'error';
                statusEl.innerText = `Error: ${error.message}`;
                resultsContainer.innerHTML = `<div class="no-results glass">Error: ${error.message}</div>`;
            }
        }

        function descargarImagen(urlEncoded, nombre, button) {
            const originalContent = button.innerHTML;
            const url = decodeURIComponent(urlEncoded);

            button.className = 'btn-download downloading';
            button.innerText = 'Descargando...';

            const proxyUrl = `${API_URL}/download?url=${encodeURIComponent(url)}`;

            fetch(proxyUrl, {
                headers: { 'x-api-key': API_KEY }
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(err.error || `Error ${response.status}`);
                        });
                    }
                    return response.blob();
                })
                .then(blob => {
                    const extension = url.split('.').pop().split('?')[0] || 'jpg';
                    const tiposPermitidos = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'];
                    const extFinal = tiposPermitidos.includes(extension.toLowerCase()) ? extension : 'jpg';

                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `${nombre.substring(0, 30)}.${extFinal}`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    setTimeout(() => {
                        URL.revokeObjectURL(link.href);
                    }, 1000);

                    button.className = 'btn-download downloaded';
                    button.innerText = 'Descargada';

                    setTimeout(() => {
                        button.className = 'btn-download';
                        button.innerHTML = originalContent;
                    }, 2000);
                })
                .catch(error => {
                    console.error('Error en descarga:', error);
                    button.className = 'btn-download error';
                    button.innerText = error.message || 'Error';

                    setTimeout(() => {
                        button.className = 'btn-download';
                        button.innerHTML = originalContent;
                    }, 2000);
                });
        }

        function limpiarResultados() {
            document.getElementById('imageResults').innerHTML = '';
            document.getElementById('searchQuery').value = '';
            const statusEl = document.getElementById('status');
            statusEl.className = '';
            statusEl.innerText = 'Listo para buscar';
            document.getElementById('searchQuery').focus();
        }

        document.getElementById('searchQuery').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') buscarImagenes();
        });

        window.addEventListener('load', function() {
            document.getElementById('searchQuery').focus();
        });

        /* --- Fondo Eléctrico Azul en Canvas --- */
        const canvas = document.getElementById("electric-canvas");
        const ctx = canvas.getContext("2d");

        let width, height, dpr;
        let bolts = [];
        let conduits = [];

        function resizeCanvas() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            initConduits();
        }

        function initConduits() {
            conduits = [];
            const count = width < 768 ? 4 : 6;
            for (let i = 0; i < count; i++) {
                const yBase = (height / (count + 1)) * (i + 1);
                conduits.push({
                    yBase,
                    amplitude: 28 + Math.random() * 45,
                    frequency: 0.002 + Math.random() * 0.0025,
                    phase: Math.random() * Math.PI * 2,
                    speed: 0.004 + Math.random() * 0.006,
                    pulsePos: Math.random(),
                    pulseSpeed: 0.0018 + Math.random() * 0.0025
                });
            }
        }

        function buildLightningPath(x1, y1, x2, y2, displace) {
            if (displace < 6) {
                return [{ x: x1, y: y1 }, { x: x2, y: y2 }];
            }
            const midX = (x1 + x2) / 2 + (Math.random() - 0.5) * displace;
            const midY = (y1 + y2) / 2 + (Math.random() - 0.5) * displace;
            const left = buildLightningPath(x1, y1, midX, midY, displace * 0.55);
            const right = buildLightningPath(midX, midY, x2, y2, displace * 0.55);
            return left.slice(0, -1).concat(right);
        }

        function spawnBolt() {
            const fromLeft = Math.random() > 0.5;
            const startX = fromLeft ? -20 : width + 20;
            const startY = Math.random() * height;
            const endX = fromLeft ? width * (0.45 + Math.random() * 0.6) : width * (Math.random() * 0.55);
            const endY = startY + (Math.random() - 0.5) * 320;

            const mainPath = buildLightningPath(startX, startY, endX, endY, 110);
            const branches = [];

            const branchCount = 1 + Math.floor(Math.random() * 2);
            for (let i = 0; i < branchCount; i++) {
                const idx = Math.floor(mainPath.length * (0.25 + Math.random() * 0.5));
                const origin = mainPath[idx];
                if (origin) {
                    const bx = origin.x + (Math.random() - 0.5) * 200;
                    const by = origin.y + (Math.random() - 0.5) * 180;
                    branches.push(buildLightningPath(origin.x, origin.y, bx, by, 55));
                }
            }

            bolts.push({
                path: mainPath,
                branches,
                alpha: 0.95,
                decay: 0.018 + Math.random() * 0.02
            });
        }

        function drawPath(points, lineWidth, strokeStyle, glowBlur, glowColor) {
            if (points.length < 2) return;
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.lineWidth = lineWidth;
            ctx.strokeStyle = strokeStyle;
            ctx.shadowBlur = glowBlur;
            ctx.shadowColor = glowColor;
            ctx.stroke();
            ctx.restore();
        }

        let lastBoltTime = 0;

        function animate(timestamp) {
            ctx.clearRect(0, 0, width, height);

            for (const c of conduits) {
                c.phase += c.speed;
                c.pulsePos = (c.pulsePos + c.pulseSpeed) % 1;

                ctx.beginPath();
                const step = 28;
                const pts = [];
                for (let x = -step; x <= width + step; x += step) {
                    const y = c.yBase
                        + Math.sin(x * c.frequency + c.phase) * c.amplitude
                        + Math.cos(x * c.frequency * 2.1 - c.phase * 1.4) * (c.amplitude * 0.3);
                    pts.push({ x, y });
                    if (x === -step) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }

                ctx.strokeStyle = "rgba(14, 165, 233, 0.14)";
                ctx.lineWidth = 1;
                ctx.stroke();

                const pulseCenter = Math.floor(c.pulsePos * (pts.length - 1));
                const segStart = Math.max(0, pulseCenter - 4);
                const segEnd = Math.min(pts.length - 1, pulseCenter + 4);
                const segment = pts.slice(segStart, segEnd + 1);

                drawPath(segment, 2.2, "rgba(56, 189, 248, 0.65)", 16, "#00a8ff");
                drawPath(segment, 1, "rgba(224, 242, 254, 0.85)", 6, "#38bdf8");
            }

            if (timestamp - lastBoltTime > 1600 + Math.random() * 2200) {
                spawnBolt();
                lastBoltTime = timestamp;
            }

            for (let i = bolts.length - 1; i >= 0; i--) {
                const b = bolts[i];
                const flicker = b.alpha * (0.75 + Math.random() * 0.25);

                drawPath(b.path, 3, `rgba(0, 168, 255, ${flicker * 0.45})`, 22, "#00a8ff");
                drawPath(b.path, 1.2, `rgba(224, 242, 254, ${flicker * 0.9})`, 8, "#38bdf8");

                for (const br of b.branches) {
                    drawPath(br, 1.6, `rgba(14, 165, 233, ${flicker * 0.35})`, 14, "#00a8ff");
                    drawPath(br, 0.7, `rgba(186, 230, 253, ${flicker * 0.7})`, 4, "#38bdf8");
                }

                b.alpha -= b.decay;
                if (b.alpha <= 0) {
                    bolts.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();
        spawnBolt();
        requestAnimationFrame(animate);
    </script>
</body>
</html>
