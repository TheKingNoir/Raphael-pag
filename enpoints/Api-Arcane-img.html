<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Arcane Imágenes - Raphael-WA-BOT</title>
    
    <link rel="icon" type="image/jpeg" href="https://files.yuki-wabot.my.id/cdn/o4L8InXt.jpeg">
    <link rel="apple-touch-icon" href="https://files.yuki-wabot.my.id/cdn/o4L8InXt.jpeg">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0f19; color: #e2e8f0; line-height: 1.6; }

        .back-btn { 
            position: fixed; top: 20px; left: 20px; background: #111827; color: white; border: none; padding: 2px; cursor: pointer; border-radius: 10px; z-index: 1000; text-decoration: none; display: flex; align-items: center;
            background: linear-gradient(270deg, #ff073a, #00f0ff, #39ff14, #ffe600, #ff073a); background-size: 400% 400%; animation: neonGradient 6s ease infinite;
        }
        .back-btn-content { background-color: #111827; padding: 6px 14px; border-radius: 8px; transition: background-color 0.2s; }
        .back-btn:hover .back-btn-content { background-color: #374151; }

        .neon-border {
            position: relative; width: 130px; height: 130px; margin: 0 auto 20px; padding: 2px; border-radius: 20px; 
            background: linear-gradient(270deg, #ff073a, #00f0ff, #39ff14, #ffe600, #ff073a); background-size: 400% 400%; animation: neonGradient 6s ease infinite;
            display: flex; justify-content: center; align-items: center;
        }
        .header-img { width: 100%; height: 100%; object-fit: cover; border-radius: 18px; background-color: #0b0f19; }

        @keyframes neonGradient {
            0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
        }

        header { padding: 40px 20px; text-align: center; border-bottom: 2px solid #4f46e5; }
        header h1 { 
            font-size: 2.8rem; font-weight: 800; text-transform: uppercase;
            background: linear-gradient(270deg, #ff073a, #00f0ff, #39ff14, #ffe600, #ff073a); background-size: 400% 400%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: neonGradient 6s ease infinite;
        }

        .section-title { text-align: center; font-size: 1.8rem; color: #fff; margin: 30px 0; text-shadow: 0 0 10px rgba(99, 102, 241, 0.5); }
        .container { max-width: 900px; margin: 0 auto 40px; padding: 20px; }
        
        .api-card-wrapper {
            position: relative; padding: 2px; border-radius: 14px;
            background: linear-gradient(270deg, #ff073a, #00f0ff, #39ff14, #ffe600, #ff073a); background-size: 400% 400%;
            animation: neonGradient 6s ease infinite; margin-bottom: 20px; box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); 
        }
        .api-card { background-color: #111827; border-radius: 12px; padding: 25px; text-align: center; }
        .api-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; color: #fff; }

        #status { text-align: center; margin-bottom: 15px; color: #00f0ff; font-weight: bold; min-height: 24px; font-size: 0.9rem; }
        #status.error { color: #ff4444; }
        #status.success { color: #39ff14; }

        .input-url { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #374151; background: #1f2937; color: white; font-size: 1rem; margin-bottom: 15px; outline: none; }
        .input-url:focus { border-color: #00f0ff; box-shadow: 0 0 5px rgba(0, 240, 255, 0.5); }

        .button-group { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .api-btn { 
            background: #1f2937; color: white; border: none; padding: 0; border-radius: 25px; font-weight: bold; font-size: 1rem; cursor: pointer;
            background: linear-gradient(270deg, #ff073a, #00f0ff, #39ff14, #ffe600, #ff073a); background-size: 400% 400%; animation: neonGradient 6s ease infinite;
            text-decoration: none; display: inline-block;
        }
        .api-btn-content { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); padding: 10px 23px; border-radius: 23px; display: block; transition: background 0.2s; }
        .api-btn:hover .api-btn-content { background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%); }

        .api-btn-small { font-size: 0.8rem; width: 100%; }
        .api-btn-small .api-btn-content { padding: 6px 10px; text-align: center; }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        .image-preview-card {
            background-color: #111827;
            border: 1px solid #374151;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .image-preview-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
        }
        .image-preview-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
            background: #1f2937;
        }
        .image-preview-card .img-title {
            font-size: 0.75rem;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 8px;
            max-height: 36px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            width: 100%;
        }
        .image-preview-card .btn-download {
            width: 100%;
            font-size: 0.8rem;
        }
        .image-preview-card .btn-download .api-btn-content {
            padding: 6px 10px;
            text-align: center;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
        }
        .image-preview-card .btn-download:hover .api-btn-content {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
        }
        .image-preview-card .btn-download.downloading .api-btn-content {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        .image-preview-card .btn-download.downloaded .api-btn-content {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }
        .image-preview-card .btn-download.error .api-btn-content {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: #00f0ff;
            font-size: 1.2rem;
        }
        .loading-spinner::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-left: 10px;
            border: 3px solid #374151;
            border-top: 3px solid #00f0ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #94a3b8;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <a href="../pestañas/apis.html" class="back-btn"><span class="back-btn-content">Volver</span></a>

    <header>
        <div class="neon-border"><img src="https://files.yuki-wabot.my.id/cdn/IT4QjwUW.jpeg" alt="Logo Bot" class="header-img"></div>
        <h1>API ARCANE IMÁGENES</h1>
        <p>Busca y descarga imagenes de forma rápida</p>
    </header>

    <h2 class="section-title">🖼️ Buscador de Imágenes</h2>

    <div class="container">
        <div class="api-card-wrapper">
            <div class="api-card">
                <div class="api-title">🔍 Escribe tu búsqueda</div>
                <div id="status">💡 Busca cualquier tema</div>
                <input type="text" id="searchQuery" class="input-url" placeholder="Ej: anime, carros, paisajes, gatos..." value="">
                <div class="button-group">
                    <button class="api-btn" onclick="buscarImagenes()"><span class="api-btn-content">🔍 Buscar Imágenes</span></button>
                    <button class="api-btn" onclick="limpiarResultados()"><span class="api-btn-content" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);">🗑️ Limpiar</span></button>
                </div>
            </div>
        </div>

        <div id="imageResults" class="image-grid"></div>
    </div>

    <script>
        const API_URL = 'https://bimg-api.raphaelbot.com';
        const API_KEY = '8affc894-e6ce-409e-95c0-ff19c8bc71e4';

        async function buscarImagenes() {
            const query = document.getElementById('searchQuery').value.trim();
            const statusEl = document.getElementById('status');
            const resultsContainer = document.getElementById('imageResults');

            if (!query) {
                statusEl.className = 'error';
                statusEl.innerText = '❌ Por favor, ingresa un término de búsqueda.';
                resultsContainer.innerHTML = '';
                return;
            }

            statusEl.className = '';
            statusEl.innerText = '⏳ Buscando imágenes...';
            resultsContainer.innerHTML = `<div class="loading-spinner">Buscando</div>`;

            try {
                const endpoint = `${API_URL}/search?query=${encodeURIComponent(query)}&limit=12&download=false`;
                
                const response = await fetch(endpoint, {
                    headers: { 'x-api-key': API_KEY }
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `Error ${response.status}`);
                }

                const data = await response.json();
                resultsContainer.innerHTML = '';

                if (!data.success || data.count === 0 || !data.results || data.results.length === 0) {
                    statusEl.className = 'error';
                    statusEl.innerText = `❌ No se encontraron imágenes para "${query}"`;
                    resultsContainer.innerHTML = `<div class="no-results">😕 No hay resultados para tu búsqueda</div>`;
                    return;
                }

                statusEl.className = 'success';
                statusEl.innerText = `✅ ${data.count} imágenes encontradas para "${query}"`;

                data.results.forEach((img, index) => {
                    const card = document.createElement('div');
                    card.className = 'image-preview-card';
                    
                    const imgUrl = img.image || img.thumbnail || '';
                    const title = img.title || `Imagen ${index + 1}`;
                    
                    card.innerHTML = `
                        <img src="${imgUrl}" alt="${title}" 
                             loading="lazy"
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22160%22%3E%3Crect fill=%22%231f2937%22 width=%22200%22 height=%22160%22/%3E%3Ctext x=%2250%%22 y=%2250%%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%236b7280%22 font-size=%2214%22 font-family=%22Arial%22%3EImagen no disponible%3C/text%3E%3C/svg%3E'">
                        <div class="img-title">${title.substring(0, 60)}${title.length > 60 ? '...' : ''}</div>
                        <button class="api-btn api-btn-small btn-download" onclick="descargarImagen('${encodeURIComponent(imgUrl)}', '${title.replace(/'/g, "\\'").replace(/"/g, '&quot;')}')">
                            <span class="api-btn-content">📥 Descargar</span>
                        </button>
                        ${img.source ? `<a href="${img.source}" target="_blank" style="font-size:0.65rem;color:#6366f1;margin-top:4px;text-decoration:none;">🔗 Fuente</a>` : ''}
                    `;
                    
                    resultsContainer.appendChild(card);
                });

            } catch (error) {
                console.error('❌ Error:', error);
                statusEl.className = 'error';
                statusEl.innerText = `❌ Error: ${error.message}`;
                resultsContainer.innerHTML = `<div class="no-results">⚠️ Error: ${error.message}</div>`;
            }
        }

        function descargarImagen(urlEncoded, nombre) {
            const button = event.currentTarget;
            const originalContent = button.innerHTML;
            const url = decodeURIComponent(urlEncoded);
            
            button.className = 'api-btn api-btn-small btn-download downloading';
            button.innerHTML = '<span class="api-btn-content">⏳ Descargando...</span>';
            
            // Usar el proxy de la API para descargar
            const proxyUrl = `${API_URL}/download?url=${encodeURIComponent(url)}`;
            
            fetch(proxyUrl, {
                headers: { 'x-api-key': API_KEY }
            })
                .then(response => {
                    if (!response.ok) {
                        return response.json().then(err => {
                            throw new Error(err.error || `Error ${response.status}`);
                        });
                    }
                    return response.blob();
                })
                .then(blob => {
                    const extension = url.split('.').pop().split('?')[0] || 'jpg';
                    const tiposPermitidos = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'];
                    const extFinal = tiposPermitidos.includes(extension.toLowerCase()) ? extension : 'jpg';
                    
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = `${nombre.substring(0, 30)}.${extFinal}`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    setTimeout(() => {
                        URL.revokeObjectURL(link.href);
                    }, 1000);
                    
                    button.className = 'api-btn api-btn-small btn-download downloaded';
                    button.innerHTML = '<span class="api-btn-content">✅ Descargada</span>';
                    
                    setTimeout(() => {
                        button.className = 'api-btn api-btn-small btn-download';
                        button.innerHTML = originalContent;
                    }, 2000);
                })
                .catch(error => {
                    console.error('Error en descarga:', error);
                    button.className = 'api-btn api-btn-small btn-download error';
                    button.innerHTML = `<span class="api-btn-content" style="background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);">❌ ${error.message || 'Error'}</span>`;
                    
                    setTimeout(() => {
                        button.className = 'api-btn api-btn-small btn-download';
                        button.innerHTML = originalContent;
                    }, 2000);
                });
        }

        function limpiarResultados() {
            document.getElementById('imageResults').innerHTML = '';
            document.getElementById('searchQuery').value = '';
            const statusEl = document.getElementById('status');
            statusEl.className = '';
            statusEl.innerText = '💡 Listo para buscar';
            document.getElementById('searchQuery').focus();
        }

        document.getElementById('searchQuery').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') buscarImagenes();
        });

        window.onload = function() {
            document.getElementById('searchQuery').focus();
        };
    </script>
</body>
</html>
