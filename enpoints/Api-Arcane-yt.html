<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Arcane YT - Raphael-WA-BOT</title>
    
    <link rel="icon" type="image/jpeg" href="https://files.yuki-wabot.my.id/cdn/o4L8InXt.jpeg">
    <link rel="apple-touch-icon" href="https://files.yuki-wabot.my.id/cdn/o4L8InXt.jpeg">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0f19; color: #e2e8f0; line-height: 1.6; }

        /* 🔙 Botón Volver (Restaurado y unificado) */
        .back-btn { 
            position: fixed; 
            top: 20px; 
            left: 20px; 
            background: #111827; 
            color: white; 
            border: none; /* Quitamos el borde sólido */
            padding: 8px 16px; 
            font-size: 0.95rem; 
            cursor: pointer; 
            border-radius: 8px; 
            z-index: 1000; 
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s; 
            /* Usamos el mismo gradiente y animación del marco de la foto */
            padding: 2px; 
            border-radius: 10px; 
            background: linear-gradient(270deg, #ff073a, #00f0ff, #39ff14, #ffe600, #ff073a);
            background-size: 400% 400%;
            animation: neonGradient 6s ease infinite;
        }

        /* Contenido interno del botón para mantener el fondo oscuro */
        .back-btn-content {
            background-color: #111827;
            padding: 6px 14px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background-color 0.2s;
        }

        .back-btn:hover .back-btn-content {
            background-color: #374151; /* Efecto hover al oscurecer el fondo */
        }

        /* 🖼️ Marco Neón Delgado (Original) */
        .neon-border {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            padding: 2px;
            border-radius: 20px; 
            background: linear-gradient(270deg, #ff073a, #00f0ff, #39ff14, #ffe600, #ff073a);
            background-size: 400% 400%;
            animation: neonGradient 6s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-img { width: 100%; height: 100%; object-fit: cover; border-radius: 18px; background-color: #0b0f19; }

        @keyframes neonGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header { padding: 40px 20px; text-align: center; border-bottom: 2px solid #4f46e5; }
        header h1 { 
            font-size: 2.8rem; font-weight: 800; text-transform: uppercase;
            background: linear-gradient(270deg, #ff073a, #00f0ff, #39ff14, #ffe600, #ff073a);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: neonGradient 6s ease infinite;
        }

        .section-title { text-align: center; font-size: 1.8rem; color: #fff; margin: 30px 0; text-shadow: 0 0 10px rgba(99, 102, 241, 0.5); }
        .container { max-width: 600px; margin: 0 auto 40px; padding: 20px; }
        
        /* 🌈 Nueva Tarjeta con Efecto Neón Multicolor (Copiado del marco) */
        .api-card-wrapper {
            position: relative;
            padding: 2px; /* Grosor del borde */
            border-radius: 14px;
            background: linear-gradient(270deg, #ff073a, #00f0ff, #39ff14, #ffe600, #ff073a);
            background-size: 400% 400%;
            animation: neonGradient 6s ease infinite;
            margin-bottom: 20px;
            /* Opcional: un ligero resplandor sombra */
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); 
        }

        .api-card { 
            background-color: #111827; 
            border-radius: 12px; 
            padding: 25px; 
            text-align: center; 
        }

        .api-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; color: #fff; }
        
        .input-url { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #374151; background: #1f2937; color: white; font-size: 1rem; margin-bottom: 15px; outline: none; }
        /* Cambiamos el color de foco a uno de la paleta neón, ej: cian */
        .input-url:focus { border-color: #00f0ff; box-shadow: 0 0 5px rgba(0, 240, 255, 0.5); }

        /* 🌈 Botón "Obtener MP3" con Efecto Neón Multicolor */
        .api-btn { 
            background: #1f2937; /* Fondo base oscuro */
            color: white; 
            border: none; 
            padding: 0; /* Quitamos padding para usar el del wrapper */
            border-radius: 25px; 
            font-weight: bold; 
            font-size: 1rem; 
            cursor: pointer; 
            display: inline-block; 
            transition: opacity 0.2s;
            
            /* Borde neón */
            position: relative;
            padding: 2px;
            background: linear-gradient(270deg, #ff073a, #00f0ff, #39ff14, #ffe600, #ff073a);
            background-size: 400% 400%;
            animation: neonGradient 6s ease infinite;
        }
        
        /* Contenido interno del botón */
        .api-btn-content {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); /* Degradado original */
            padding: 10px 23px;
            border-radius: 23px;
            display: block;
            transition: background 0.2s;
        }

        .api-btn:hover .api-btn-content {
            background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%); /* Hover más oscuro */
        }
    </style>
</head>
<body>

    <!-- Botón Volver (Texto restaurado y ruta corregida) -->
    <a href="../apis.html" class="back-btn">
        <span class="back-btn-content">⬅️ Volver</span>
    </a>

    <header>
        <div class="neon-border">
            <img src="https://files.yuki-wabot.my.id/cdn/cn3UFsii.jpeg" alt="Logo Bot" class="header-img">
        </div>
        <h1>API ARCANE YT</h1>
        <p>Descarga audio en formato MP3 por nombre o enlace de forma rápida.</p>
    </header>

    <h2 class="section-title">Prueba Nuestra API</h2>

    <div class="container">
        <div class="api-card-wrapper"> <!-- Borde neón aplicado aquí -->
            <div class="api-card">
                <div class="api-title">🎵 Descargar MP3</div>
                <input type="text" id="ytUrl" class="input-url" placeholder="Pon el nombre de la canción o pega el enlace...">
                <br>
                <!-- Botón con borde neón aplicado aquí -->
                <button class="api-btn" onclick="descargarAudio()">
                    <span class="api-btn-content">Obtener MP3</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Función para enviar la petición a nuestro servidor de Cafirexos
        function descargarAudio() {
            const urlInput = document.getElementById('ytUrl').value.trim();
            if (!urlInput) {
                alert("Por favor, ingresa el nombre de una canción o un enlace.");
                return;
            }
            
            // Redirige a la API en Cafirexos para iniciar la búsqueda y descarga automática del MP3
            window.location.href = `http://fsn1-de.cafirexos.com:5158/api/yt?url=${encodeURIComponent(urlInput)}`;
        }
    </script>
</body>
</html>
