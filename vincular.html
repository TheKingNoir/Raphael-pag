<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vincular - Raphael-WA-BOT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #070913;
            color: #f1f5f9;
            line-height: 1.6;
        }

        /* 🛠️ Botón y Menú Lateral con estilo brillante */
        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border: none;
            padding: 12px 16px;
            font-size: 22px;
            cursor: pointer;
            border-radius: 12px;
            z-index: 1000;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .menu-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.8);
        }

        .side-menu {
            height: 100%;
            width: 0;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #0f172a;
            overflow-x: hidden;
            transition: 0.4s;
            padding-top: 60px;
            z-index: 1001;
            border-right: 2px solid #a855f7;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.8);
        }

        .side-menu a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 1.2rem;
            color: #cbd5e1;
            display: block;
            transition: 0.3s;
        }

        .side-menu a:hover {
            color: #fff;
            background: linear-gradient(90deg, #3b82f6, transparent);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 36px;
            color: #f43f5e;
        }

        header {
            background: radial-gradient(circle at center, #1e1b4b 0%, #0b0f19 100%);
            padding: 70px 20px;
            text-align: center;
            border-bottom: 2px solid rgba(168, 85, 247, 0.3);
            box-shadow: inset 0 -20px 20px -20px rgba(168, 85, 247, 0.2);
        }

        header h1 {
            font-size: 2.8rem;
            background: linear-gradient(135deg, #c084fc 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 800;
        }

        header p {
            font-size: 1.15rem;
            color: #94a3b8;
            max-width: 600px;
            margin: 0 auto;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .donation-card {
            background: linear-gradient(145deg, #111827 0%, #0f172a 100%);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.05);
            text-align: center;
        }

        .donation-card h3 {
            color: #38bdf8;
            margin-bottom: 25px;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .method-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .method-btn {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #f1f5f9;
            border: 1px solid #3b82f6;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }

        .method-btn:hover {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-color: #60a5fa;
            color: white;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6);
            transform: translateY(-2px);
        }

        .auth-box {
            background: rgba(15, 23, 42, 0.7);
            padding: 30px;
            border-radius: 12px;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed rgba(56, 189, 248, 0.3);
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
        }

        .phone-input {
            padding: 12px 16px;
            width: 85%;
            max-width: 320px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #070913;
            color: #f1f5f9;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .phone-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        footer {
            text-align: center;
            padding: 35px;
            background-color: #04060b;
            color: #64748b;
            margin-top: 60px;
            border-top: 1px solid #1e293b;
            font-size: 0.9rem;
        }
    </style>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>

    <div id="sideMenu" class="side-menu">
        <a href="javascript:void(0)" class="close-btn" onclick="toggleMenu()">&times;</a>
        <a href="index.html">🏠 Inicio</a>
        <a href="comandos.html">🛠️ Comandos</a>
        <a href="donaciones.html">💰 Donaciones</a>
    </div>

    <header>
        <h1>VINCULA TU DISPOSITIVO</h1>
        <p>Conecta tu WhatsApp a Raphael-WA-BOT de forma rápida y segura.</p>
    </header>

    <div class="container">
        <div class="donation-card">
            <h3>📱 Selecciona el método de vinculación</h3>
            
            <div class="method-buttons">
                <button class="method-btn" onclick="showMethod('qr')">📷 Código QR</button>
                <button class="method-btn" onclick="showMethod('code')">🔢 Código Numérico</button>
            </div>

            <div id="qr-section" class="auth-box">
                <div id="qr-content">
                    <p style="color: #38bdf8; font-weight: 500;">🔄 Conectando con el servidor...</p>
                </div>
            </div>

            <div id="code-section" class="auth-box" style="display: none;">
                <p style="color: #94a3b8; margin-bottom: 15px; font-weight: 500;">🔢 Ingresa tu número con código de país</p>
                <input type="text" id="phone-input" class="phone-input" placeholder="Ej: 584123456789">
                <button class="method-btn" onclick="requestPairingCode()">Obtener Código</button>
                <div id="display-code" style="margin-top: 20px; font-size: 1.3rem; color: #38bdf8; font-weight: bold;"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 RAPHAEL-WA-BOT ° Hecho y Desarrollado Por Ares Arcane.©</p>
    </footer>

    <script>
        const SOCKET_URL = "https://tu-vps-ip-o-dominio.com:3000"; 
        const socket = io(SOCKET_URL, { autoConnect: false });

        function toggleMenu() {
            const menu = document.getElementById("sideMenu");
            if (menu.style.width === "250px") {
                menu.style.width = "0";
            } else {
                menu.style.width = "250px";
            }
        }

        function showMethod(method) {
            const qrSection = document.getElementById('qr-section');
            const codeSection = document.getElementById('code-section');
            
            if (method === 'qr') {
                qrSection.style.display = 'flex';
                codeSection.style.display = 'none';
                if (!socket.connected) socket.connect();
            } else {
                qrSection.style.display = 'none';
                codeSection.style.display = 'flex';
                if (socket.connected) socket.disconnect();
            }
        }

        socket.on('connect', () => {
            document.getElementById('qr-content').innerHTML = '<p style="color: #38bdf8;">Esperando código QR del bot...</p>';
        });

        socket.on('qr', (qrImageSrc) => {
            document.getElementById('qr-content').innerHTML = `<img src="${qrImageSrc}" alt="Código QR de WhatsApp" style="max-width: 200px; border-radius: 8px; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);">`;
        });

        socket.on('disconnect', () => {
            document.getElementById('qr-content').innerHTML = '<p style="color: #f43f5e;">Desconectado del servidor.</p>';
        });

        function requestPairingCode() {
            const phoneNumber = document.getElementById('phone-input').value.trim();
            const displayDiv = document.getElementById('display-code');

            if (!phoneNumber) {
                alert("Por favor, ingresa un número de teléfono válido.");
                return;
            }

            displayDiv.innerHTML = "⏳ Solicitando código...";

            fetch(`${SOCKET_URL}/pairing-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phoneNumber })
            })
            .then(response => response.json())
            .then(data => {
                if (data.code) {
                    displayDiv.innerHTML = `🔑 Tu código es: <span style="color: #c084fc; background: #070913; padding: 6px 12px; border-radius: 6px; border: 1px solid #c084fc;">${data.code}</span>`;
                } else {
                    displayDiv.innerHTML = `<span style="color: #f43f5e;">Error al generar el código.</span>`;
                }
            })
            .catch(error => {
                console.error("Error:", error);
                displayDiv.innerHTML = `<span style="color: #f43f5e;">No se pudo conectar con la VPS.</span>`;
            });
        }

        document.addEventListener("click", function(event) {
            const menu = document.getElementById("sideMenu");
            const menuBtn = document.querySelector(".menu-btn");
            
            if (menu.style.width === "250px" && !menu.contains(event.target) && !menuBtn.contains(event.target)) {
                menu.style.width = "0";
            }
        });
    </script>
</body>
</html>
