<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vincular - Raphael-WA-BOT</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            line-height: 1.6;
        }

        /* 🛠️ Estilos del Menú Lateral */
        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #6366f1;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 20px;
            cursor: pointer;
            border-radius: 8px;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.4);
            transition: background 0.2s, transform 0.1s;
        }

        .menu-btn:hover {
            background: #4f46e5;
        }

        .menu-btn:active {
            transform: scale(0.92);
        }

        .side-menu {
            height: 100%;
            width: 0;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #111827;
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
            z-index: 1001;
            border-right: 2px solid #4f46e5;
            box-shadow: 5px 0 15px rgba(0, 0, 0, 0.5);
        }

        .side-menu a {
            padding: 15px 25px;
            text-decoration: none;
            font-size: 1.2rem;
            color: #e2e8f0;
            display: block;
            transition: 0.3s;
        }

        .side-menu a:hover {
            color: #c084fc;
            background: #1f2937;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 36px;
        }

        header {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            padding: 60px 20px;
            text-align: center;
            border-bottom: 2px solid #4f46e5;
        }

        header h1 {
            font-size: 2.5rem;
            color: #c084fc;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1.1rem;
            color: #93c5fd;
            max-width: 600px;
            margin: 0 auto;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .donation-card {
            background-color: #111827;
            border: 1px solid #1f2937;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .donation-card h3 {
            color: #93c5fd;
            margin-bottom: 20px;
            font-size: 1.4rem;
        }

        .method-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .method-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            transition: all 0.2s;
        }

        .method-btn:hover {
            background: #4f46e5;
            border-color: #4f46e5;
            color: white;
        }

        .auth-box {
            background: #1e293b;
            padding: 25px;
            border-radius: 8px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px dashed #475569;
        }

        .phone-input {
            padding: 10px;
            width: 80%;
            max-width: 300px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            margin-bottom: 15px;
            text-align: center;
            font-size: 1rem;
        }

        footer {
            text-align: center;
            padding: 30px;
            background-color: #030712;
            color: #6b7280;
            margin-top: 60px;
            border-top: 1px solid #1f2937;
            font-size: 0.9rem;
        }
    </style>
    <!-- Incluimos Socket.IO para la comunicación en tiempo real con tu VPS -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    <!-- Botón para abrir el menú lateral -->
    <button class="menu-btn" onclick="toggleMenu()">☰</button>

    <!-- Panel del Menú Lateral -->
    <div id="sideMenu" class="side-menu">
        <a href="javascript:void(0)" class="close-btn" onclick="toggleMenu()">&times;</a>
        <a href="index.html">🏠 Inicio</a>
        <a href="comandos.html">🛠️ Comandos</a>
        <a href="donaciones.html">💰 Donaciones</a>
    </div>

    <header>
        <h1>🌐 Vincular Dispositivo</h1>
        <p>Conecta tu WhatsApp a Raphael-WA-BOT de forma rápida y segura.</p>
    </header>

    <div class="container">
        <div class="donation-card">
            <h3>📱 Selecciona el método de vinculación</h3>
            
            <!-- Botones para elegir método -->
            <div class="method-buttons">
                <button class="method-btn" onclick="showMethod('qr')">📷 Código QR</button>
                <button class="method-btn" onclick="showMethod('code')">🔢 Código Numérico</button>
            </div>

            <!-- Contenedor del Código QR -->
            <div id="qr-section" class="auth-box">
                <div id="qr-content">
                    <p style="color: #94a3b8;">🔄 Conectando con el servidor...</p>
                </div>
            </div>

            <!-- Contenedor del Código de Emparejamiento -->
            <div id="code-section" class="auth-box" style="display: none;">
                <p style="color: #94a3b8; margin-bottom: 15px;">🔢 Ingresa tu número con código de país</p>
                <input type="text" id="phone-input" class="phone-input" placeholder="Ej: 584123456789">
                <button class="method-btn" onclick="requestPairingCode()">Obtener Código</button>
                <div id="display-code" style="margin-top: 20px; font-size: 1.3rem; color: #38bdf8; font-weight: bold;"></div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 RAPHAEL-WA-BOT ° Hecho y Desarrollado Por Ares Arcane.©</p>
    </footer>

    <script>
        // Cambia esta URL por la IP o dominio de tu VPS y el puerto donde corre tu bot
        const SOCKET_URL = "https://tu-vps-ip-o-dominio.com:3000"; 
        const socket = io(SOCKET_URL, { autoConnect: false });

        function toggleMenu() {
            const menu = document.getElementById("sideMenu");
            if (menu.style.width === "250px") {
                menu.style.width = "0";
            } else {
                menu.style.width = "250px";
            }
        }

        function showMethod(method) {
            const qrSection = document.getElementById('qr-section');
            const codeSection = document.getElementById('code-section');
            
            if (method === 'qr') {
                qrSection.style.display = 'flex';
                codeSection.style.display = 'none';
                
                // Conectar al socket para pedir el QR
                if (!socket.connected) socket.connect();
            } else {
                qrSection.style.display = 'none';
                codeSection.style.display = 'flex';
                if (socket.connected) socket.disconnect();
            }
        }

        // Escuchar eventos del servidor de la VPS para el QR
        socket.on('connect', () => {
            document.getElementById('qr-content').innerHTML = '<p style="color: #38bdf8;">Esperando código QR del bot...</p>';
        });

        socket.on('qr', (qrImageSrc) => {
            // El servidor envía la imagen del QR o los datos para generarla
            document.getElementById('qr-content').innerHTML = `<img src="${qrImageSrc}" alt="Código QR de WhatsApp" style="max-width: 200px; border-radius: 8px;">`;
        });

        socket.on('disconnect', () => {
            document.getElementById('qr-content').innerHTML = '<p style="color: #ef4444;">Desconectado del servidor.</p>';
        });

        function requestPairingCode() {
            const phoneNumber = document.getElementById('phone-input').value.trim();
            const displayDiv = document.getElementById('display-code');

            if (!phoneNumber) {
                alert("Por favor, ingresa un número de teléfono válido.");
                return;
            }

            displayDiv.innerHTML = "⏳ Solicitando código...";

            // Realizamos una petición HTTP a tu VPS para pedir el código de emparejamiento
            fetch(`${SOCKET_URL}/pairing-code`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: phoneNumber })
            })
            .then(response => response.json())
            .then(data => {
                if (data.code) {
                    displayDiv.innerHTML = `🔑 Tu código es: <span style="color: #c084fc; background: #0f172a; padding: 5px 10px; border-radius: 4px;">${data.code}</span>`;
                } else {
                    displayDiv.innerHTML = `<span style="color: #ef4444;">Error al generar el código.</span>`;
                }
            })
            .catch(error => {
                console.error("Error:", error);
                displayDiv.innerHTML = `<span style="color: #ef4444;">No se pudo conectar con la VPS.</span>`;
            });
        }

        // Cerrar menú al hacer clic fuera
        document.addEventListener("click", function(event) {
            const menu = document.getElementById("sideMenu");
            const menuBtn = document.querySelector(".menu-btn");
            
            if (menu.style.width === "250px" && !menu.contains(event.target) && !menuBtn.contains(event.target)) {
                menu.style.width = "0";
            }
        });
    </script>
</body>
</html>
