<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de Número - Raphael-WA-BOT</title>
    
    <link rel="icon" type="image/jpeg" href="https://files.yuki-wabot.my.id/cdn/o4L8InXt.jpeg">
    <link rel="apple-touch-icon" href="https://files.yuki-wabot.my.id/cdn/o4L8InXt.jpeg">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0f19; color: #e2e8f0; line-height: 1.6; }

        /* 🔙 Estilos del Botón de Regresar */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: #1f2937;
            color: #e2e8f0;
            border: 1px solid #374151;
            padding: 10px 16px;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 8px;
            z-index: 1000;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, border-color 0.2s;
        }
        .back-btn:hover {
            background: #374151;
            border-color: #6366f1;
            color: #fff;
        }

        header { padding: 40px 20px; text-align: center; border-bottom: 2px solid #4f46e5; }
        header h1 { font-size: 2.5rem; font-weight: 800; color: #fff; margin-bottom: 10px; }
        header p { color: #9ca3af; }

        .container { 
            max-width: 650px; 
            margin: 40px auto; 
            padding: 20px; 
        }

        .check-card { 
            background-color: #111827; 
            border: 1px solid #1f2937; 
            border-radius: 14px; 
            padding: 30px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 0.95rem;
            color: #f3f4f6;
            font-weight: 600;
        }

        .form-input {
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            padding: 12px 16px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #6366f1;
        }

        .check-btn {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); 
            color: white; 
            border: none;
            padding: 12px; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .check-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(168, 85, 247, 0.4);
        }

        /* 📱 Caja de Resultado */
        .result-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            background: #1f2937;
            border: 1px solid #374151;
            display: none;
            text-align: center;
            font-weight: 500;
        }

        .result-box.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- 🔙 Botón de regresar -->
    <a href="index.html" class="back-btn">←</a>

    <header>
        <h1>VERIFICADOR DE NÚMERO</h1>
        <p>Comprueba el estado de un número en WhatsApp de forma rápida.</p>
    </header>

    <div class="container">
        <div class="check-card">
            <div class="form-group">
                <label class="form-label" for="phoneNumber">Ingresa tu número de teléfono</label>
                <input type="text" id="phoneNumber" class="form-input" placeholder="Ej: +521234567890">
            </div>
            
            <button class="check-btn" onclick="checkNumberStatus()">Verificar Estado</button>

            <div id="resultBox" class="result-box">
                <span id="resultText">Esperando consulta...</span>
            </div>
        </div>
    </div>

    <script>
        async function checkNumberStatus() {
            const input = document.getElementById("phoneNumber").value.trim();
            const resultBox = document.getElementById("resultBox");
            const resultText = document.getElementById("resultText");

            if (!input) {
                resultBox.className = "result-box active";
                resultText.style.color = "#f87171";
                resultText.innerHTML = "⚠️ Por favor, ingresa un número de teléfono válido.";
                return;
            }

            resultBox.className = "result-box active";
            resultText.style.color = "#9ca3af";
            resultText.innerHTML = "⏳ Consultando el estado en el servidor...";

            try {
                // 🌐 Recuerda cambiar "https://tu-servidor.com" por la URL real de tu backend
                const response = await fetch(`https://tu-servidor.com/api/check-number?phone=${encodeURIComponent(input)}`);
                const data = await response.json();

                if (data.exists) {
                    resultText.style.color = "#34d399";
                    resultText.innerHTML = `✅ El número <strong>${input}</strong> está activo y registrado en WhatsApp.`;
                } else {
                    resultText.style.color = "#f87171";
                    resultText.innerHTML = `❌ El número <strong>${input}</strong> no está registrado o se encuentra suspendido/inactivo.`;
                }
            } catch (error) {
                resultText.style.color = "#f87171";
                resultText.innerHTML = "❌ Ocurrió un error al conectar con el servidor de consultas.";
            }
        }
    </script>
</body>
</html>
