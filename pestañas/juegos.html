<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona de Juegos - Raphael-WA-BOT</title>
    
    <link rel="icon" type="image/jpeg" href="https://files.yuki-wabot.my.id/cdn/o4L8InXt.jpeg">
    <link rel="apple-touch-icon" href="https://files.yuki-wabot.my.id/cdn/o4L8InXt.jpeg">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0f19; color: #e2e8f0; line-height: 1.6; }

        /* 🔙 Botón Volver */
        .back-btn { 
            position: fixed; top: 20px; left: 20px; background: #111827; color: white; border: none; padding: 2px; cursor: pointer; border-radius: 10px; z-index: 1000; text-decoration: none; display: flex; align-items: center;
            background: linear-gradient(270deg, #ff073a, #00f0ff, #39ff14, #ffe600, #ff073a); background-size: 400% 400%; animation: neonGradient 6s ease infinite;
        }
        .back-btn-content { background-color: #111827; padding: 6px 14px; border-radius: 8px; transition: background-color 0.2s; }
        .back-btn:hover .back-btn-content { background-color: #374151; }

        .neon-border {
            position: relative; width: 130px; height: 130px; margin: 0 auto 20px; padding: 2px; border-radius: 20px; 
            background: linear-gradient(270deg, #ff073a, #00f0ff, #39ff14, #ffe600, #ff073a); background-size: 400% 400%; animation: neonGradient 6s ease infinite;
            display: flex; justify-content: center; align-items: center;
        }
        .header-img { width: 100%; height: 100%; object-fit: cover; border-radius: 18px; background-color: #0b0f19; }

        @keyframes neonGradient {
            0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; }
        }

        header { padding: 40px 20px; text-align: center; border-bottom: 2px solid #4f46e5; }
        header h1 { 
            font-size: 2.8rem; font-weight: 800; text-transform: uppercase;
            background: linear-gradient(270deg, #ff073a, #00f0ff, #39ff14, #ffe600, #ff073a); background-size: 400% 400%;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: neonGradient 6s ease infinite;
        }

        .section-title { text-align: center; font-size: 1.8rem; color: #fff; margin: 30px 0; text-shadow: 0 0 10px rgba(99, 102, 241, 0.5); }
        .container { max-width: 650px; margin: 0 auto 40px; padding: 20px; }
        
        /* 🎮 Nueva Tarjeta compacta en horizontal */
        .game-card {
            background-color: #111827; 
            border-radius: 12px; 
            padding: 15px; 
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #374151;
            margin-bottom: 20px;
        }

        /* Imagen lateral sin bordes neón */
        .game-img-container {
            flex-shrink: 0;
            width: 90px;
            height: 90px;
            border-radius: 8px;
            overflow: hidden;
            background-color: #1f2937;
        }
        .game-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Contenido al lado de la imagen */
        .game-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .game-title { 
            font-size: 1.1rem; 
            font-weight: bold; 
            margin-bottom: 5px; 
            color: #fff; 
        }

        .game-desc {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 10px;
        }

        .api-btn { 
            background: #1f2937; color: white; border: none; padding: 0; border-radius: 20px; font-weight: bold; font-size: 0.85rem; cursor: pointer;
            background: linear-gradient(270deg, #ff073a, #00f0ff, #39ff14, #ffe600, #ff073a); background-size: 400% 400%; animation: neonGradient 6s ease infinite;
            text-decoration: none; display: inline-block; width: fit-content;
        }
        .api-btn-content { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); padding: 6px 16px; border-radius: 18px; display: block; transition: background 0.2s; }
        .api-btn:hover .api-btn-content { background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%); }
    </style>
</head>
<body>

    <!-- Botón para volver con borde neón original -->
    <a href="../pestañas/apis.html" class="back-btn"><span class="back-btn-content">Volver</span></a>

    <header>
        <!-- Primera foto con marco neón original -->
        <div class="neon-border"><img src="https://files.yuki-wabot.my.id/cdn/czIqrdU1.jpeg" alt="Logo Bot" class="header-img"></div>
        <!-- Título con neón original -->
        <h1>ZONA DE JUEGOS</h1>
        <p>Explora tus juegos favoritos y contenido interactivo.</p>
    </header>

    <h2 class="section-title">Elige Tu Juego</h2>

    <div class="container">
        <!-- Tarjeta de Minecraft compacta (imagen a un lado, descripción y botón al otro, sin bordes neón) -->
        <div class="game-card">
            <div class="game-img-container">
                <img src="https://files.yuki-wabot.my.id/cdn/jZlymkt3.jpeg" alt="Minecraft" class="game-img">
            </div>
            <div class="game-info">
                <div class="game-title">MINECRAFT</div>
                <div class="game-desc">Servidor disponible para java y bedrock.</div>
                <a href="minecraft.html" class="api-btn">
                    <span class="api-btn-content">Ir al Servidor</span>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
