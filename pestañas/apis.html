<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APIs - Raphael-WA-BOT</title>
    
    <link rel="icon" type="image/jpeg" href="https://files.yuki-wabot.my.id/cdn/o4L8InXt.jpeg">
    <link rel="apple-touch-icon" href="https://files.yuki-wabot.my.id/cdn/o4L8InXt.jpeg">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0f19; color: #e2e8f0; line-height: 1.6; }

        /* 🖼️ Marco Neón más delgado */
        .neon-border {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            padding: 2px; /* Reducido para que sea más delgado */
            border-radius: 20px; 
            background: linear-gradient(270deg, #ff073a, #00f0ff, #39ff14, #ffe600, #ff073a);
            background-size: 400% 400%;
            animation: neonGradient 6s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .header-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 18px; 
            background-color: #0b0f19;
        }

        /* ✨ Animación Neón */
        @keyframes neonGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 🛠️ Estilos del menú y encabezado */
        .menu-btn { position: fixed; top: 20px; left: 20px; background: #6366f1; color: white; border: none; padding: 10px 15px; font-size: 20px; cursor: pointer; border-radius: 8px; z-index: 1000; }
        header { padding: 40px 20px; text-align: center; border-bottom: 2px solid #4f46e5; }
        header h1 { 
            font-size: 2.8rem; font-weight: 800; text-transform: uppercase;
            background: linear-gradient(270deg, #ff073a, #00f0ff, #39ff14, #ffe600, #ff073a);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: neonGradient 6s ease infinite;
        }

        /* 📋 Título de sección */
        .section-title {
            text-align: center;
            font-size: 1.8rem;
            color: #fff;
            margin-bottom: 20px;
            margin-top: 20px;
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }

        .container { max-width: 800px; margin: 0 auto 40px; padding: 20px; }
        .api-card { background-color: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); transition: transform 0.2s; }
        .api-card:hover { transform: translateY(-3px); border-color: #6366f1; }
        .api-title { font-size: 1.3rem; color: #93c5fd; font-weight: bold; }
        .api-btn { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: white; text-decoration: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; display: inline-block; margin-top: 10px;}
    </style>
</head>
<body>

    <button class="menu-btn" onclick="toggleMenu()">☰</button>

    <header>
        <div class="neon-border">
            <img src="https://files.yuki-wabot.my.id/cdn/ZABRgOSF.jpeg" alt="Logo Bot" class="header-img">
        </div>
        <h1>APIs ARCANE</h1>
        <p>Explora y prueba los endpoints disponibles.</p>
    </header>

    <!-- 🏷️ Nuevo Título de Sección -->
    <h2 class="section-title">Nuestras APIs Disponibles</h2>

    <div class="container">
        <div class="api-card">
            <div class="api-title">🌐 API ARCANE YT</div>
            <a href="#" class="api-btn">🔗 Probar API</a>
        </div>
        <!-- Puedes seguir agregando más tarjetas .api-card aquí -->
    </div>

</body>
</html>
